version: 14
'rules':
- 'name': 'ssn'
  'pattern': '\b\d{3}-\d{2}-\d{4}\b'
- 'name': 'email'
  'pattern': '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
- 'name': 'phone_us'
  'pattern': '(?<![\d(])(?:\+1[ .-]?)?(?:\(\d{3}\)|\d{3})[ .-]?\d{3}[ .-]?\d{4}\b'
- 'name': 'credit_card'
  'pattern': '\b(?:\d[ -]?){12,15}\d\b'
  'validator': 'luhn'
- 'name': 'ssn_spaced'
  'pattern': '\b\d(?:[\s\-‑\u2011\u00A0]+\d){8}\b'
- 'name': 'phone_spaced'
  'pattern': '\b(?:\+1[\s\-‑\u2011\u00A0]*)?\d(?:[\s\-‑\u2011\u00A0]+\d){9}\b'
- 'name': 'credit_card_spaced'
  'pattern': '\b\d(?:[\s\-‑\u2011\u00A0]+\d){12,18}\b'
  'validator': 'luhn'
- 'name': 'dob_spaced'
  'pattern': '\b\d{2}[\s\-‑/\u2011\u00A0]+\d{2}[\s\-‑/\u2011\u00A0]+\d{4}\b'
- 'name': 'fullwidth_digits'
  'pattern': '[\uFF10-\uFF19]+(?:[\s\-‑/\u2011\u00A0]+[\uFF10-\uFF19]+)+'
- 'name': 'spelled_digits'
  'pattern': '\b(?:zero|one|two|three|four|five|six|seven|eight|nine)(?:\s+(?:-|dash)?\s+(?:zero|one|two|three|four|five|six|seven|eight|nine))+\b'
  'ignore_case': !!bool 'true'
- 'name': 'split_line_digits'
  'pattern': '\b\d(?:\n\d)+\b'
- 'name': 'unicode_separator_digits'
  'pattern': '\b\d(?:[\u2011\u00A0]+\d)+\b'
- 'name': 'url_encoded'
  'pattern': '(?:%[0-9A-Fa-f]{2})+'
  'validator': 'decodes_to_pii_url'
- 'name': 'base64_ssn'
  'pattern': '(?<=ssn=)[A-Za-z0-9+/]+={0,2}|(?<=ssn:\s)[A-Za-z0-9+/]+={0,2}'
- 'name': 'base64_phone'
  'pattern': '(?<=phone=)[A-Za-z0-9+/]+={0,2}|(?<=phone:\s)[A-Za-z0-9+/]+={0,2}'
- 'name': 'base64_credit_card'
  'pattern': '(?<=credit_card=)[A-Za-z0-9+/]+={0,2}|(?<=credit_card:\s)[A-Za-z0-9+/]+={0,2}'
- 'name': 'base64_dob'
  'pattern': '(?<=dob=)[A-Za-z0-9+/]+={0,2}|(?<=dob:\s)[A-Za-z0-9+/]+={0,2}'
- 'name': 'base64_email'
  'pattern': '(?<=email=)[A-Za-z0-9+/]+={0,2}|(?<=email:\s)[A-Za-z0-9+/]+={0,2}'
- 'name': 'hex_ssn'
  'pattern': '(?<=ssn=)[0-9a-fA-F]+|(?<=ssn:\s)[0-9a-fA-F]+'
- 'name': 'hex_phone'
  'pattern': '(?<=phone=)[0-9a-fA-F]+|(?<=phone:\s)[0-9a-fA-F]+'
- 'name': 'hex_credit_card'
  'pattern': '(?<=credit_card=)[0-9a-fA-F]+|(?<=credit_card:\s)[0-9a-fA-F]+'
- 'name': 'hex_dob'
  'pattern': '(?<=dob=)[0-9a-fA-F]+|(?<=dob:\s)[0-9a-fA-F]+'
- 'name': 'generic_base64_pii'
  'pattern': '[A-Za-z0-9+/]{12,}(?:={0,2})'
  'validator': 'decodes_to_pii_base64'
- 'name': 'generic_hex_pii'
  'pattern': '[0-9a-fA-F]{12,}'
  'validator': 'decodes_to_pii_hex'
- 'name': 'generic_reversed_pii'
  'pattern': '\b\d(?:[\s\-‑\u2011\u00A0]+\d){2,}\b'
  'validator': 'reversed_is_pii'

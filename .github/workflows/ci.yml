name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gate tests read gen-* tags
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,middleware,presidio]" "nemoguardrails>=0.24"
          uv pip install pip && uv run --no-sync python -m spacy download en_core_web_lg
      - name: Git identity for gate tests (they commit to temp repos)
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: Test (no network, no API keys)
        run: uv run --no-sync pytest -q -W error::SyntaxWarning
      - name: Build package
        run: uv build

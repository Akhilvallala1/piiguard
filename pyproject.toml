[project]
name = "piiguard"
version = "0.1.0"
description = "Self-hardening PII leak guard for sandboxed AI agents (Recursive Agents Hackathon, 2026-10-17)"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "regex>=2024.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
piiguard = "piiguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["piiguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]

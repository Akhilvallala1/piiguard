[project]
name = "piiguard"
version = "0.1.0"
description = "Self-hardening PII leak guard for AI agents: reversible redaction proxy with gated, auditable rule evolution"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Akhil Vallala", email = "akhilvallala0115@gmail.com" }]
keywords = ["pii", "redaction", "llm", "guardrails", "ai-agents", "privacy", "data-loss-prevention"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "regex>=2024.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "grpcio-tools>=1.60"]
# `piiguard middleware`: the guard as an OpenShell supervisor middleware (gRPC, RFC 0009)
middleware = ["grpcio>=1.60", "protobuf>=6.31", "pyjwt[crypto]>=2.8"]
# local base detectors (no text leaves the host): `--detector presidio` / `--detector gliner`
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
gliner = ["gliner>=0.2.16"]

[project.scripts]
piiguard = "piiguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["piiguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
